name: V3 PostgreSQL foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jackstudio_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: v3/package-lock.json
      - run: npm ci
        working-directory: v3
      - run: npm test
        working-directory: v3
        env:
          TEST_DATABASE_URL: postgres://test:disposable-ci-only@localhost:5432/jackstudio_test
      - run: npm run build
        working-directory: v3
