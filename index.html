y:block}.product-cell small{color:var(--muted);display:block;margin-top:4px}.status{display:inline-flex;align-items:center;padding:5px 9px;border-radius:6px;background:#e8f3e7;color:#316a32;font-size:11px;font-weight:750}.status.draft{background:#f3eee6;color:#8e7157}.status.pending{background:#fff2d7;color:#8b6413}.status.fulfilled{background:#e5f1ed;color:#357267}.muted{color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0 16px;font-size:12px;font-weight:650}.field input,.field textarea,.field select{padding:11px 12px;background:#fff;border:1px solid #cbd5cd;border-radius:9px;color:#273128;min-width:0}.field textarea{min-height:98px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.button-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.modal-bg{position:fixed;inset:0;background:#0d180e88;z-index:20;display:grid;place-items:center;padding:16px}.modal{background:white;border-radius:14px;width:min(590px,100%);padding:24px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px #0005}.modal h2{margin:0 0 8px;font-size:20px}.modal p{font-size:12px;color:var(--muted)}.bar-chart{height:190px;display:flex;align-items:end;gap:6px;padding:16px 0 5px}.bar{background:linear-gradient(0deg,#658a70,#a9c2a3);border-radius:4px 4px 0 0;flex:1;min-height:9px}.chartlabel{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.site-preview{margin:14px 18px 18px;background:var(--ivory);border:1px solid #e7dfc8;border-radius:9px;overflow:hidden}.announcement{text-align:center;background:var(--sage);color:#fff;letter-spacing:.15em;font-size:8px;font-weight:700;padding:10px}.site-header{display:flex;justify-content:space-between;align-items:center;padding:15px 19px;background:#f8f5e9}.site-header b{letter-spacing:.2em;font-size:11px}.site-header span{font-size:9px;color:#575b53}.hero{height:255px;background:linear-gradient(90deg,#130f0ec9 0%,#130f0e72 47%,#1b181323 100%),url('./jackstudio-admin-mvp/public/assets/hero-photo.jpg') center/cover;display:flex;align-items:center;padding:24px;color:white}.hero .kicker{font-size:9px;letter-spacing:.15em;font-weight:700}.hero h3{font-size:30px;line-height:1.1;letter-spacing:-.04em;margin:10px 0 7px;max-width:310px}.hero p{font-size:11px;opacity:.8;max-width:280px}.hero .cta{background:var(--tan);border:0;color:#fff;padding:9px 13px;font-size:10px;margin-top:8px}.listline{padding:14px 19px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}.preview-device{border:1px solid #e6e6e1;background:#f7f8f5;border-radius:12px;padding:12px;overflow:hidden}.store-shell{background:#f7f4e9;min-height:100vh}.store-nav{background:#f9f6ed;padding:22px max(22px,5vw);display:flex;align-items:center;justify-content:space-between}.store-nav b{letter-spacing:.23em}.store-nav nav{display:flex;gap:23px;font-size:12px}.store-hero{min-height:490px;background:linear-gradient(90deg,#171510c6 5%,#17151040 70%),url('./jackstudio-admin-mvp/public/assets/hero-photo.jpg') center/cover;display:flex;align-items:center;padding:45px 7vw;color:white}.store-hero h1{font-size:clamp(39px,6vw,75px);line-height:1;letter-spacing:-.05em;max-width:650px;margin:13px 0}.store-hero p{font-size:15px;max-width:480px;line-height:1.7}.store-grid{padding:52px 6vw 80px;max-width:1500px;margin:auto}.store-grid h2{font-size:26px}.products-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px}.product-card{background:#fff;padding:12px 12px 19px;border:1px solid #ece8db;border-radius:10px}.product-card img{width:100%;aspect-ratio:4/5;object-fit:contain;background:#f2efe6;border-radius:8px}.product-card b{display:block;font-size:13px;margin:11px 0 6px}.product-card span{font-size:12px;color:var(--muted)}.store-banner{background:#2d4534;color:#f3f2e9;padding:11px;text-align:center;font-size:11px;letter-spacing:.08em}.empty{color:var(--muted);padding:25px;text-align:center;font-size:13px}.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.media-tile{background:#f6f3e9;padding:11px;border-radius:9px;min-width:0;text-align:center}.media-tile img{height:110px;width:100%;object-fit:contain}.media-tile small{display:block;color:#69716b;margin-top:9px;overflow:hidden;text-overflow:ellipsis}.editline{display:flex;gap:7px;flex-wrap:wrap}.editline .btn{padding:6px 10px;font-size:11px}.mobile-toggle{display:none}.page-items{display:grid;grid-template-columns:230px 1fr;gap:18px}.page-nav button{display:block;width:100%;border:1px solid var(--border);background:white;padding:13px;border-radius:9px;margin-bottom:7px;text-align:left;font-size:12px}.page-nav button.active{border-color:#8da68a;background:#f0f6ee}.smallprint{font-size:11px;color:var(--muted);line-height:1.7}.footer{padding-top:32px;font-size:11px;color:var(--muted);text-align:center}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.products-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:740px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-270px;width:254px;z-index:15;transition:left .25s}.sidebar.open{left:0}.mobile-toggle{display:block}.topbar{padding:0 16px;height:61px}.content{padding:22px 15px 45px}.chip{display:none}.heading h1{font-size:23px}.metrics{gap:10px}.metric{padding:15px}.metric .num{font-size:22px}.page-items{grid-template-columns:1fr}.page-nav{display:flex;gap:6px;overflow:auto}.page-nav button{min-width:140px}.media-grid{grid-template-columns:repeat(2,1fr)}.store-nav nav{display:none}.products-grid{grid-template-columns:repeat(2,1fr)}.store-hero{min-height:365px}}

<body><div id="app"></div><div id="modal-container"></div>
<script>
(()=>{'use strict';
const KEY='jackstudio-github-pages-demo-v1';
const assets='./jackstudio-admin-mvp/public/assets/';
const seed={products:[{id:'JS-101',name:'Urban Carry Briefcase',sku:'JS-UB101',category:'Urban Carry',price:25900,stock:24,status:'Active',image:assets+'product-1.svg'},{id:'JS-102',name:'Craft Heritage Backpack',sku:'JS-CH102',category:'Craft Heritage',price:38900,stock:15,status:'Active',image:assets+'product-2.svg'},{id:'JS-103',name:'Professional Wallet',sku:'JS-PW103',category:'Professional',price:13900,stock:42,status:'Active',image:assets+'product-3.svg'},{id:'JS-104',name:'Travel Movement Sling',sku:'JS-TM104',category:'Travel Movement',price:18900,stock:18,status:'Active',image:assets+'product-4.svg'},{id:'JS-105',name:'Essential Card Holder',sku:'JS-EC105',category:'Essential',price:7900,stock:35,status:'Active',image:assets+'product-5.svg'},{id:'JS-106',name:'Make It Personal Pouch',sku:'JS-MP106',category:'Make It Personal',price:12900,stock:13,status:'Draft',image:assets+'product-6.svg'}],settings:{announcement:'LOGO CUSTOMIZE, NAME CUSTOMIZE, GIFT BOX AVAILABLE FOR BULK PURCHASE ORDER',heroKicker:'FROM EVERYDAY ESSENTIALS',heroTitle:'TO EVERY JOURNEY',heroSubtitle:'Thoughtful design. Trusted quality. Care beyond every purchase.',heroButton:'Explore Collections'},pages:[{id:'home',name:'Home',title:'From Everyday Essentials to Every Journey',description:'Discover the Jack Studio collection.',status:'Published'},{id:'brand',name:'Brand Story',title:'Our Story',description:'From understanding everyday needs to creating accessories for every journey.',status:'Published'},{id:'services',name:'Our Services',title:'We Care Beyond Every Purchase',description:'Thoughtful services designed around your needs.',status:'Published'},{id:'corporate',name:'Corporate Solution',title:'Corporate Gifts',description:'Thoughtful gifting for meaningful connections.',status:'Draft'},{id:'contact',name:'Contact',title:'Get In Touch',description:'Connect with our team.',status:'Published'}]};
let data;try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):JSON.parse(JSON.stringify(seed));if(!data.products||!data.pages||!data.settings)throw Error('invalid')}catch{data=JSON.parse(JSON.stringify(seed))}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Browser storage is full. Try smaller images or clear demo data.')}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'RM '+(Number(v)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const nav=[['home','▦','Dashboard'],['products','◇','Products'],['collections','▥','Collections'],['orders','▤','Orders'],['customers','♙','Customers'],['analytics','▥','Analytics'],['pages','▧','Website Pages'],['media','▣','Media Library'],['settings','⚙','Settings']];
const demoOrders=[{id:'#1001',customer:'Sample Customer A',total:29800,status:'Fulfilled'},{id:'#1002',customer:'Sample Customer B',total:13900,status:'Pending'},{id:'#1003',customer:'Sample Customer C',total:51800,status:'Fulfilled'}];
let route=(location.hash.replace(/^#/, '')||'home').split('?')[0],pageSelected='home',search='';
const heading=(title,subtitle='',buttons='')=>`<div class="heading"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="actions">${buttons}</div></div>`;
const notice='<div class="notice"><b>Static GitHub Pages demo:</b> This is a preview, not a secure live admin. Products and page edits save only in <b>this browser</b>. Orders, customers and analytics are sample data. No real login, payment or shared database is active.</div>';
function shell(){const section=nav.find(n=>n[0]===route);return `<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">JS</div><div><div class="brand-name">JACK STUDIO</div><div class="brand-sub">Commerce Admin · Preview</div></div></div><div class="side-search">⌕ &nbsp; Admin workspace</div><div class="nav-kicker">MANAGEMENT</div>${nav.map(n=>`<button class="navbtn ${route===n[0]?'active':''}" data-route="${n[0]}"><span class="sym">${n[1]}</span>${n[2]}</button>`).join('')}<div class="nav-kicker">SALES CHANNEL</div><button class="navbtn ${route==='store'?'active':''}" data-route="store"><span class="sym">▤</span>Online Store ↗</button><div class="sidebar-bottom"><div class="avatar">JS</div><div><b>Jack Studio</b><div style="color:#9aa89e;margin-top:3px">Development preview</div></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;gap:11px;align-items:center"><button class="btn sm mobile-toggle" id="menu">☰</button><strong>${esc(section?.[2]||'Online Store')}</strong></div><div class="top-actions"><span class="chip">● DEMO MODE</span><button class="btn" data-route="store">View Store ↗</button><div class="avatar">JS</div></div></header><div class="content">${view()}</div></main></div>`}
function hero(){const s=data.settings;return `<div class="site-preview"><div class="announcement">${esc(s.announcement)}</div><div class="site-header"><b>JACK STUDIO</b><span>Home &nbsp;&nbsp; About Us &nbsp;&nbsp; Collections &nbsp;&nbsp; Contact</span></div><div class="hero"><div><div class="kicker">${esc(s.heroKicker)}</div><h3>${esc(s.heroTitle)}</h3><p>${esc(s.heroSubtitle)}</p><button class="cta" data-route="store">${esc(s.heroButton)}</button></div></div></div>`}
function metrics(){return `<div class="metrics"><div class="metric"><div class="small">Active products</div><div class="num">${data.products.filter(p=>p.status==='Active').length}</div><div class="note">Editable in this demo</div></div><div class="metric"><div class="small">Sample orders</div><div class="num">${demoOrders.length}</div><div class="note">Illustrative orders only</div></div><div class="metric"><div class="small">Sample revenue</div><div class="num">RM 955.00</div><div class="note">Not real sales data</div></div><div class="metric"><div class="small">Site pages</div><div class="num">${data.pages.length}</div><div class="note">Browser-local content edits</div></div></div>`}
function dashboard(){const bars=[22,43,28,54,45,64,40,53,67,62,48,76,54,87,68,71,81,64,77,92,73,80,94,85];return heading('Overview','Welcome back. Your Jack Studio commerce workspace.','<button class="btn primary" data-action="new-product">+ Add product</button>')+notice+metrics()+`<div class="two-col"><div><div class="panel"><div class="panel-head"><div><h2>Store performance</h2><p>Illustrative data · last 30 days</p></div><span class="chip">SAMPLE</span></div><div class="panel-body"><div class="bar-chart">${bars.map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div><div class="chartlabel"><span>30 days ago</span><span>Today</span></div></div></div><div class="panel"><div class="panel-head"><div><h2>Online store</h2><p>Customer-facing website preview</p></div><button class="btn sm" data-route="pages">Edit content</button></div>${hero()}</div></div><div><div class="panel"><div class="panel-head"><div><h2>Recent orders</h2><p>Example records</p></div><button class="btn sm" data-route="orders">View all</button></div>${demoOrders.map(o=>`<div class="listline"><div><b>${o.id}</b><div class="muted" style="margin-top:5px">${o.customer}</div></div><b>${money(o.total)}</b></div>`).join('')}</div><div class="panel"><div class="panel-head"><div><h2>Quick actions</h2><p>Manage your preview</p></div></div><div class="panel-body"><div class="editline"><button class="btn" data-action="new-product">Add Product</button><button class="btn" data-route="pages">Edit Pages</button><button class="btn" data-route="settings">Store Settings</button></div></div></div></div></div>`}
function productList(){const list=data.products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(search.toLowerCase()));return heading('Products','Manage products in your browser-local demo.','<button class="btn primary" data-action="new-product">+ Add product</button>')+notice+`<div class="panel"><div class="panel-head"><div><h2>All products <span class="muted">(${list.length})</span></h2><p>Changes appear in the demo storefront</p></div><input aria-label="Search products" id="search-product" placeholder="Search name, SKU, category" value="${esc(search)}" style="border:1px solid #d4ded6;border-radius:9px;padding:9px;width:220px;max-width:40vw"></div><div class="table-scroll"><table><thead><tr><th>PRODUCT</th><th>STATUS</th><th>INVENTORY</th><th>PRICE</th><th>ACTIONS</th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="product-cell"><img src="${esc(p.image)}" alt=""><div><strong>${esc(p.name)}</strong><small>${esc(p.category)} · ${esc(p.sku)}</small></div></div></td><td><span class="status ${p.status==='Draft'?'draft':''}">${esc(p.status)}</span></td><td>${Number(p.stock)}</td><td>${money(p.price)}</td><td><div class="editline"><button class="btn" data-action="edit-product" data-id="${esc(p.id)}">Edit</button><button class="btn danger" data-action="delete-product" data-id="${esc(p.id)}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No products found.</td></tr>'}</tbody></table></div></div>`}
function collections(){const c=[...new Set(data.products.map(p=>p.category))];return heading('Collections','Product categories are grouped automatically.')+notice+`<div class="panel"><div class="panel-head"><h2>Product collections</h2></div>${c.map(cat=>`<div class="listline"><div><b>${esc(cat)}</b><div class="muted" style="margin-top:5px">${data.products.filter(p=>p.category===cat).length} products</div></div><button class="btn sm" data-route="products">Manage products</button></div>`).join('')}</div>`}
function orders(){return heading('Orders','Sample records for interface preview.')+notice+`<div class="panel"><div class="panel-head"><h2>Orders</h2><span class="chip">SAMPLE DATA</span></div><div class="table-scroll"><table><thead><tr><th>ORDER</th><th>CUSTOMER</th><th>TOTAL</th><th>FULFILMENT</th></tr></thead><tbody>${demoOrders.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.customer}</td><td>${money(o.total)}</td><td><span class="status ${o.status.toLowerCase()}">${o.status}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function customers(){return heading('Customers','Example records only. No actual customer information is stored.')+notice+`<div class="panel"><div class="panel-head"><h2>Customer overview</h2></div><div class="table-scroll"><table><thead><tr><th>CUSTOMER</th><th>ORDERS</th><th>STATUS</th></tr></thead><tbody>${[['Sample Customer A',3,'Demo'],['Sample Customer B',1,'Demo'],['Sample Customer C',2,'Demo']].map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td><span class="status draft">${c[2]}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function analytics(){return heading('Analytics','Illustrative dashboard — no real tracking is connected.')+notice+metrics()+`<div class="panel"><div class="panel-head"><h2>Visitor trend</h2><span class="chip">SAMPLE CHART</span></div><div class="panel-body"><div class="bar-chart">${[34,41,52,47,67,58,74,62,80,70,93,75,82,65,90,78,83,96].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div><div class="chartlabel"><span>Earlier</span><span>Recent</span></div></div></div>`}
function pages(){const p=data.pages.find(p=>p.id===pageSelected)||data.pages[0];pageSelected=p.id;return heading('Website Pages','Edit text content and publishing labels in this local preview.','<button class="btn" data-route="store">View Store ↗</button>')+notice+`<div class="page-items"><div class="page-nav">${data.pages.map(x=>`<button class="${pageSelected===x.id?'active':''}" data-action="select-page" data-id="${x.id}">${esc(x.name)}<br><small class="muted">${esc(x.status)}</small></button>`).join('')}</div><div class="panel"><div class="panel-head"><h2>Edit ${esc(p.name)}</h2><span class="chip">LOCAL ONLY</span></div><form class="panel-body" id="page-form"><label class="field">Page title<input name="title" required value="${esc(p.title)}"></label><label class="field">Description<textarea name="description">${esc(p.description)}</textarea></label><label class="field">Status<select name="status"><option ${p.status==='Published'?'selected':''}>Published</option><option ${p.status==='Draft'?'selected':''}>Draft</option></select></label><div class="button-row"><button type="submit" class="btn primary">Save page</button></div></form></div></div>`}
function media(){return heading('Media Library','Example images supplied with the original Admin prototype.')+notice+`<div class="panel"><div class="panel-head"><h2>Existing assets</h2></div><div class="panel-body"><div class="media-grid">${Array.from({length:8},(_,i)=>`<div class="media-tile"><img src="${assets}product-${i+1}.svg" alt="Product sample ${i+1}"><small>product-${i+1}.svg</small></div>`).join('')}</div><p class="smallprint">Real media uploads require cloud storage or the local Node.js backend. This public static preview cannot upload images to the shared repository.</p></div></div>`}
function settings(){const s=data.settings;return heading('Settings','Edit demo hero content and the announcement bar.')+notice+`<div class="two-col"><div class="panel"><div class="panel-head"><h2>Homepage appearance</h2></div><form class="panel-body" id="settings-form"><label class="field">Announcement bar<input name="announcement" value="${esc(s.announcement)}"></label><label class="field">Hero eyebrow<input name="heroKicker" value="${esc(s.heroKicker)}"></label><label class="field">Hero headline<input name="heroTitle" value="${esc(s.heroTitle)}"></label><label class="field">Hero description<textarea name="heroSubtitle">${esc(s.heroSubtitle)}</textarea></label><label class="field">CTA label<input name="heroButton" value="${esc(s.heroButton)}"></label><div class="button-row"><button class="btn danger" type="button" data-action="reset-data">Reset demo data</button><button class="btn primary" type="submit">Save changes</button></div></form></div><div class="panel"><div class="panel-head"><h2>Live preview</h2></div>${hero()}</div></div>`}
function storefront(){const s=data.settings;return `<div class="store-shell"><div class="store-banner">DEMO STOREFRONT · CHECKOUT NOT AVAILABLE</div><div class="store-nav"><b>JACK STUDIO</b><nav><a href="#store">Home</a><a href="#store-products">Collections</a><a href="#pages">Our Services</a></nav><button class="btn sm" data-route="home">← Admin Dashboard</button></div><section class="store-hero"><div><div style="letter-spacing:.2em;font-size:12px;font-weight:700">${esc(s.heroKicker)}</div><h1>${esc(s.heroTitle)}</h1><p>${esc(s.heroSubtitle)}</p><a class="btn primary" href="#store-products" style="display:inline-block;margin-top:14px">${esc(s.heroButton)}</a></div></section><section id="store-products" class="store-grid"><p style="font-size:11px;letter-spacing:.15em;color:#8b6e43">JACK STUDIO COLLECTION</p><h2>Everyday essentials, thoughtfully made.</h2><div class="products-grid">${data.products.filter(p=>p.status==='Active').map(p=>`<article class="product-card"><img src="${esc(p.image)}" alt="${esc(p.name)}"><b>${esc(p.name)}</b><span>${money(p.price)} · ${esc(p.category)}</span></article>`).join('')}</div><p class="smallprint">This is a static product display preview. No payment processing or stock synchronization.</p></section></div>`}
function view(){switch(route){case 'home':return dashboard();case 'products':return productList();case 'collections':return collections();case 'orders':return orders();case 'customers':return customers();case 'analytics':return analytics();case 'pages':return pages();case 'media':return media();case 'settings':return settings();default:return dashboard()}}
function render(){document.title='Jack Studio | '+(route==='store'?'Storefront Preview':'Commerce Admin Preview');document.getElementById('app').innerHTML=route==='store'?storefront():shell();wire();}
function navigate(r){route=r;location.hash=r;render();window.scrollTo(0,0)}
function toast(msg){const el=document.createElement('div');el.textContent=msg;el.style.cssText='position:fixed;right:20px;bottom:18px;background:#243c2c;color:#fff;padding:13px 18px;border-radius:10px;z-index:30;box-shadow:0 8px 35px #0003;font-size:13px';document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function productModal(p=null){const original=!!p,pd=p||{name:'',sku:'',category:'Urban Carry',price:0,stock:0,status:'Draft',image:assets+'product-1.svg'};document.getElementById('modal-container').innerHTML=`<div class="modal-bg" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${original?'Edit product':'Add product'}"><h2>${original?'Edit product':'Add product'}</h2><p>Product changes remain only in this browser until a real backend is connected.</p><form id="product-form"><label class="field">Product name<input name="name" required maxlength="120" value="${esc(pd.name)}"></label><div class="formgrid"><label class="field">SKU<input name="sku" required maxlength="50" value="${esc(pd.sku)}"></label><label class="field">Category<input name="category" required value="${esc(pd.category)}"></label><label class="field">Price (RM)<input name="price" type="number" required min="0" step="0.01" value="${(pd.price/100).toFixed(2)}"></label><label class="field">Stock<input name="stock" type="number" min="0" step="1" required value="${Number(pd.stock)}"></label></div><label class="field">Product image URL<input name="image" value="${esc(pd.image)}"></label><label class="field">Product status<select name="status"><option ${pd.status==='Active'?'selected':''}>Active</option><option ${pd.status==='Draft'?'selected':''}>Draft</option></select></label><div class="button-row"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${original?'Save product':'Add product'}</button></div></form></div></div>`;document.getElementById('product-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const n={id:p?.id||'JS-'+Date.now(),name:String(fd.get('name')).trim(),sku:String(fd.get('sku')).trim(),category:String(fd.get('category')).trim(),price:Math.round(Number(fd.get('price'))*100),stock:Number(fd.get('stock')),status:String(fd.get('status')),image:String(fd.get('image')).trim()||assets+'product-1.svg'};if(!n.name||!n.sku||!n.category||!Number.isFinite(n.price)||n.price<0||!Number.isInteger(n.stock)||n.stock<0){alert('Please enter valid product details.');return}data.products=original?data.products.map(x=>x.id===p.id?n:x):[n,...data.products];save();closeModal();render();toast(original?'Product updated':'Product created')};}
function closeModal(){document.getElementById('modal-container').innerHTML=''}
function wire(){document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.route)));document.getElementById('menu')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const action=b.dataset.action,id=b.dataset.id;switch(action){case 'new-product':productModal();break;case 'edit-product':productModal(data.products.find(p=>p.id===id));break;case 'delete-product':if(confirm('Delete this demo product?')){data.products=data.products.filter(p=>p.id!==id);save();render();toast('Product deleted')}break;case 'close-modal':closeModal();break;case 'reset-data':if(confirm('Reset all browser-local demo edits?')){data=JSON.parse(JSON.stringify(seed));save();render();toast('Demo reset')}break;case 'select-page':pageSelected=id;render();break;}}));const searchEl=document.getElementById('search-product');if(searchEl)searchEl.addEventListener('input',e=>{search=e.target.value;const position=e.target.selectionStart;render();const next=document.getElementById('search-product');next.focus();next.setSelectionRange(position,position)});const pf=document.getElementById('page-form');if(pf)pf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(pf);const x=data.pages.find(p=>p.id===pageSelected);Object.assign(x,{title:String(fd.get('title')).trim(),description:String(fd.get('description')).trim(),status:String(fd.get('status'))});save();render();toast('Page saved in this browser')});const sf=document.getElementById('settings-form');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(sf);for(const k in data.settings)data.settings[k]=String(fd.get(k)||'');save();render();toast('Storefront settings saved')});}
window.addEventListener('hashchange',()=>{const next=(location.hash.replace(/^#/,'')||'home').split('?')[0];if(next==='store-products'){route='store';render();setTimeout(()=>document.getElementById('store-products')?.scrollIntoView(),0)}else if(next!==route){route=next;render()}});
if(route==='store-products'){route='store'}if(![...nav.map(n=>n[0]),'store'].includes(route))route='home';render();
})();
</script>
</body></html>
