<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Jack Studio Staff · Staging</title><link rel="stylesheet" href="/styles.css"></head><body><main class="panel panel-body"><h1>Jack Studio Staff</h1><p>Staging · No checkout or production data</p><p id="message" role="status" aria-live="polite">Loading configuration…</p><form id="login"><label>Email <input id="email" type="email" required autocomplete="username"></label><label>Password <input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><button id="reset">Send password reset email</button><section id="recovery" hidden><label>New password <input id="new-password" type="password" minlength="16" autocomplete="new-password"></label><button id="update-password">Set new password</button></section><section id="mfa" hidden><p>Verify your authenticator to access the workspace.</p><button id="enroll">Set up authenticator</button><img id="qr" alt="Authenticator enrollment QR code" hidden><label>Authenticator code <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button id="verify">Verify MFA</button></section><button id="logout" hidden>Sign out</button><section id="workspace" hidden><h2>Shared catalogue</h2><button id="refresh">Refresh from database</button><pre id="catalogue"></pre><h2>Media Library</h2><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button id="upload">Upload master image</button><ul id="media"></ul></section></main><script type="module" src="/admin.js"></script></body></html>
